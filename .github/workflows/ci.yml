name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A newer push to the same ref makes the running one redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # `npm ci` fails if package-lock.json drifts from package.json, which makes
      # a stale lockfile a build failure rather than a silent surprise.
      - name: Install dependencies
        run: npm ci

      # Production dependencies only: a vulnerable dev tool is a real problem but
      # not a shipped one, and failing the build over it trains people to ignore
      # the step. High and above; Dependabot handles the rest.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # The repository includes PGlite, so the sync tests run against a real
      # Postgres engine in-process. No database service container is required.
      - name: Test
        run: npx vitest run --coverage

      - name: Build
        run: npm run build

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore
